<svg xmlns="http://www.w3.org/2000/svg" width="980" height="600" viewBox="0 0 980 600">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
    <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
  </marker>
  <style>
    .box{fill:#fff;stroke:#334155;stroke-width:2;rx:12}
    .title{font:700 20px Arial;fill:#0f172a}
    .txt{font:16px Arial;fill:#334155}
    .line{stroke:#334155;stroke-width:2;marker-end:url(#arrow)}
    .db{fill:#eef2ff;stroke:#4f46e5;stroke-width:2}
    .storage{fill:#ecfdf5;stroke:#059669;stroke-width:2}
    .bg{fill:#fff7ed;stroke:#ea580c;stroke-width:2}
  </style>
</defs>

<text x="490" y="42" text-anchor="middle" class="title">Product Manager CRUD - Architecture</text>

<rect x="60" y="95" width="190" height="80" class="box"/>
<text x="155" y="126" text-anchor="middle" class="title">User / Browser</text>
<text x="155" y="153" text-anchor="middle" class="txt">HTML CRUD</text>

<rect x="60" y="235" width="190" height="80" class="box"/>
<text x="155" y="266" text-anchor="middle" class="title">API Client</text>
<text x="155" y="293" text-anchor="middle" class="txt">JSON / REST</text>

<rect x="365" y="155" width="250" height="120" class="box"/>
<text x="490" y="192" text-anchor="middle" class="title">Render Web Service</text>
<text x="490" y="220" text-anchor="middle" class="txt">Python + Flask</text>
<text x="490" y="247" text-anchor="middle" class="txt">Web UI + Public API</text>

<rect x="730" y="90" width="190" height="90" class="db"/>
<text x="825" y="125" text-anchor="middle" class="title">PostgreSQL</text>
<text x="825" y="152" text-anchor="middle" class="txt">Persistent data</text>

<rect x="730" y="250" width="190" height="90" class="storage"/>
<text x="825" y="285" text-anchor="middle" class="title">File Storage</text>
<text x="825" y="312" text-anchor="middle" class="txt">Cloudinary / uploads</text>

<rect x="365" y="410" width="250" height="100" class="bg"/>
<text x="490" y="445" text-anchor="middle" class="title">Background Task</text>
<text x="490" y="472" text-anchor="middle" class="txt">APScheduler every 60 sec</text>
<text x="490" y="495" text-anchor="middle" class="txt">quantity=0 → unavailable</text>

<line x1="250" y1="135" x2="365" y2="185" class="line"/>
<line x1="250" y1="275" x2="365" y2="240" class="line"/>
<line x1="615" y1="185" x2="730" y2="145" class="line"/>
<line x1="615" y1="245" x2="730" y2="290" class="line"/>
<line x1="490" y1="410" x2="490" y2="276" class="line"/>
<line x1="615" y1="445" x2="760" y2="180" class="line"/>

<text x="303" y="145" class="txt">HTTP</text>
<text x="650" y="152" class="txt">SQLAlchemy</text>
<text x="645" y="279" class="txt">Images</text>
</svg>