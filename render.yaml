services:
  - type: web
    name: product-manager-crud
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: product-manager-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENABLE_SCHEDULER
        value: "true"
      - key: BACKGROUND_INTERVAL_SECONDS
        value: "60"

databases:
  - name: product-manager-db
    plan: free
    region: frankfurt
